<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" href="https://drive.google.com/uc?export=view&id=1GWFh0nTW3fEbtsdV8cPuIp-2d3YjLmRJ">
<link rel="apple-touch-icon" href="https://drive.google.com/uc?export=view&id=1GWFh0nTW3fEbtsdV8cPuIp-2d3YjLmRJ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6B5B45">
<meta name="apple-mobile-web-app-title" content="DUAVA Nexo">
<link rel="manifest" href="manifest.json">
<title>DUAVA Nexo</title>
    <style>
        /* ============================================
           DUAVA NEXO - ESTILOS PRINCIPALES (sin cambios)
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --crema: #F5F0E8; --crema-oscuro: #E8E0D4; --gris-claro: #9E9A93; --gris-medio: #6B6560;
            --gris-oscuro: #4A4540; --marron: #8B7355; --marron-oscuro: #6B5B45; --rojo-alerta: #C75B5B;
            --naranja: #D4A574; --verde: #7A9E7A; --blanco: #FAF8F5; --sombra: rgba(74, 69, 64, 0.15);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; background: var(--crema); color: var(--gris-oscuro); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: linear-gradient(135deg, var(--crema) 0%, var(--crema-oscuro) 100%); }
        .login-logo { font-size: 2.5rem; font-weight: 700; color: var(--marron-oscuro); margin-bottom: 5px; letter-spacing: 2px; }
        .login-subtitle { font-size: 2.5rem; color: var(--gris-claro); margin-bottom: 40px; font-weight: 400; border-bottom: 3px solid var(--marron);}
        .login-card { background: var(--blanco); border-radius: 20px; padding: 30px 25px; width: 100%; max-width: 360px; box-shadow: 0 10px 40px var(--sombra); }
        .login-card h2 { text-align: center; color: var(--gris-oscuro); margin-bottom: 25px; font-size: 1.3rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--gris-medio); font-size: 0.9rem; font-weight: 500; }
        .form-group select, .form-group input { width: 100%; padding: 14px 16px; border: 2px solid var(--crema-oscuro); border-radius: 12px; font-size: 1rem; background: var(--blanco); color: var(--gris-oscuro); transition: all 0.3s; outline: none; }
        .btn-login { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--marron) 0%, var(--marron-oscuro) 100%); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .login-error { color: var(--rojo-alerta); text-align: center; margin-top: 15px; font-size: 0.9rem; display: none; }
        .app-container { display: none; min-height: 100vh; padding-bottom: 80px; }
        .app-header { background: linear-gradient(135deg, var(--marron-oscuro) 0%, var(--marron) 100%); color: white; padding: 15px 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 20px var(--sombra); }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-size: 1.4rem; font-weight: 700; letter-spacing: 1px; }
        .header-user { font-size: 0.85rem; opacity: 0.9; display: flex; align-items: center; gap: 8px; }
        .btn-logout { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--blanco); display: flex; justify-content: space-around; padding: 8px 0; box-shadow: 0 -2px 20px var(--sombra); z-index: 100; border-top: 1px solid var(--crema-oscuro); }
        .nav-item { display: flex; flex-direction: column; align-items: center; padding: 5px 15px; cursor: pointer; color: var(--gris-claro); transition: all 0.3s; border: none; background: none; font-size: 0.75rem; }
        .nav-item.active { color: var(--marron); }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 3px; }
        .section { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .section-title { font-size: 1.5rem; color: var(--gris-oscuro); margin-bottom: 20px; font-weight: 600; }
        .card { background: var(--blanco); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 12px var(--sombra); border: 1px solid var(--crema-oscuro); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 1.1rem; font-weight: 600; color: var(--gris-oscuro); }
        .btn { padding: 12px 20px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, var(--marron) 0%, var(--marron-oscuro) 100%); color: white; width: 100%; }
        .btn-success { background: linear-gradient(135deg, var(--verde) 0%, #5A8A5A 100%); color: white; }
        .btn-danger { background: var(--rojo-alerta); color: white; }
        .btn-whatsapp { background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--marron); color: var(--marron); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 6px; color: var(--gris-medio); font-size: 0.85rem; font-weight: 500; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px 14px; border: 2px solid var(--crema-oscuro); border-radius: 10px; font-size: 1rem; background: var(--blanco); color: var(--gris-oscuro); outline: none; }
        .input-group textarea { resize: vertical; min-height: 80px; }
        .search-box { position: relative; margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 14px 45px 14px 16px; border: 2px solid var(--crema-oscuro); border-radius: 12px; font-size: 1rem; background: var(--blanco); outline: none; }
        .search-box svg { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--gris-claro); }
        .list-item { background: var(--blanco); border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px var(--sombra); border: 1px solid var(--crema-oscuro); cursor: pointer; }
        .list-item.alert { border-left: 4px solid var(--rojo-alerta); }
        .list-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .list-item-title { font-weight: 600; color: var(--gris-oscuro); font-size: 1.05rem; }
        .list-item-subtitle { color: var(--gris-claro); font-size: 0.85rem; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-odonto { background: #E3F2FD; color: #1976D2; }
        .badge-celebraciones { background: #F3E5F5; color: #7B1FA2; }
        .badge-alert { background: #FFEBEE; color: var(--rojo-alerta); }
        .slote{background:#e7f3ff;border:2px solid #0066cc;border-radius:8px;padding:10px;margin:6px 0;cursor:pointer}
        .slote.sel{background:#0066cc;color:#fff}
        .badge-t{background:#ffc107;color:#333;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:bold}
        .badge-r{background:#dc3545;color:#fff;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:bold}
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: var(--blanco); border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--crema-oscuro); }
        .product-info h4 { font-size: 1rem; color: var(--gris-oscuro); margin-bottom: 4px; }
        .product-info .price { color: var(--marron); font-weight: 700; font-size: 1.1rem; }
        .product-info .stock { font-size: 0.8rem; color: var(--gris-claro); }
        .product-actions { display: flex; align-items: center; gap: 10px; }
        .qty-btn { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--crema-oscuro); background: var(--blanco); color: var(--gris-oscuro); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .qty-display { font-weight: 700; min-width: 30px; text-align: center; }
        .cart-summary { background: var(--blanco); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 12px var(--sombra); border: 2px solid var(--marron); }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--crema-oscuro); }
        .cart-total { font-size: 1.3rem; font-weight: 700; color: var(--marron-oscuro); text-align: right; margin-top: 10px; padding-top: 10px; border-top: 2px solid var(--crema-oscuro); }
        .discount-selector { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .discount-btn { padding: 8px 16px; border: 2px solid var(--crema-oscuro); background: var(--blanco); border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        .discount-btn.active { background: var(--marron); color: white; border-color: var(--marron); }
        .discount-custom { display: flex; align-items: center; gap: 8px; }
        .discount-custom input { width: 70px; padding: 8px; border: 2px solid var(--crema-oscuro); border-radius: 8px; text-align: center; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(74, 69, 64, 0.6); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--blanco); border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; animation: modalIn 0.3s ease; }
        @keyframes modalIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 1.3rem; font-weight: 600; color: var(--gris-oscuro); }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--gris-claro); cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--gris-claro); }
        .hidden { display: none !important; }
        .mt-10 { margin-top: 10px; }
        .mb-10 { margin-bottom: 10px; }
        .flex { display: flex; }
        .flex-between { justify-content: space-between; }
        .items-center { align-items: center; }
        .gap-10 { gap: 10px; }
        .w-full { width: 100%; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-logo">DUAVA</div>
        <div class="login-subtitle">Nexo</div>
        <div class="login-card">
            <h2>Acceso de Vendedor</h2>
            <div class="form-group">
                <label>Vendedor</label>
                <select id="loginVendedor"><option value="">Selecciona vendedor</option></select>
            </div>
            <div class="form-group">
                <label>Clave</label>
                <input type="password" id="loginClave" placeholder="Ingresa tu clave">
            </div>
            <button class="btn-login" onclick="app.login()">Ingresar</button>
            <div class="login-error" id="loginError">Clave incorrecta</div>
        </div>
    </div>

    <!-- APP -->
    <div class="app-container" id="appContainer">
        <div class="app-header">
            <div class="header-top">
                <div class="header-title">DUAVA NEXO</div>
                <div class="header-user">
                    <span id="userName">Vendedor</span>
                    <button class="btn-logout" onclick="localStorage.removeItem('duava_sesion'); document.getElementById('appContainer').style.display='none'; document.getElementById('loginScreen').style.display='flex';">Salir</button>
                </div>
            </div>
        </div>
        <div class="sync-status sync-online" id="syncStatus">● Online</div>

        <!-- CLIENTES -->
        <div class="section active" id="sectionClientes">
            <div class="section-title">Clientes</div>
            <div id="alertasContainer"></div>
            <div class="search-box">
                <input type="text" id="searchClientes" placeholder="Buscar cliente..." onkeyup="app.buscarClientes()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
            </div>
            <button class="btn btn-primary mb-10" onclick="app.mostrarModalCliente()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nuevo Cliente
            </button>
            <div id="listaClientes"></div>
        </div>

        <!-- VENTAS -->
        <div class="section" id="sectionVentas">
            <div class="section-title">Nueva Venta</div>
            <div class="card">
                <div class="input-group">
                    <label>Tienda</label>
                    <select id="ventaTienda" onchange="app.renderProductosVenta()">
                        <option value="ODONTO STORE">Odonto Store</option>
                        <option value="CELEBRACIONES">Celebraciones</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Cliente</label>
                    <select id="ventaCliente" onchange="app.seleccionarClienteVenta()"><option value="">Selecciona un cliente</option></select>
                </div>
                <div id="infoClienteVenta" class="hidden">
                    <div class="flex flex-between items-center mt-10">
                        <span id="clienteVentaNombre"></span>
                        <button class="btn btn-whatsapp" style="padding:8px 12px;font-size:0.8rem;">WhatsApp</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><div class="card-title">Productos</div></div>
                <div id="listaProductosVenta"></div>
            </div>
            <div class="cart-summary" id="cartSummary" style="display:none;">
                <div class="card-title mb-10">Resumen</div>
                <div id="cartItems"></div>
                <div class="mt-20">
                    <label style="display:block;margin-bottom:8px;color:var(--gris-medio);font-size:0.9rem;">Descuento</label>
                    <div class="discount-selector">
                        <button class="discount-btn active" onclick="app.setDescuento(0)">0%</button>
                        <button class="discount-btn" onclick="app.setDescuento(3)">3%</button>
                        <button class="discount-btn" onclick="app.setDescuento(5)">5%</button>
                        <button class="discount-btn" onclick="app.setDescuento(9)">9%</button>
                        <div class="discount-custom">
                            <input type="number" id="descuentoCustom" placeholder="%" min="0" max="100" onchange="app.setDescuentoCustom()">
                            <span>%</span>
                        </div>
                    </div>
                </div>
                <div class="cart-total" id="cartTotal">Total: $0.00</div>
                <button class="btn btn-success w-full mt-10" onclick="app.mostrarConfirmacionVenta()">Revisar Venta</button>
            </div>
        </div>

        <!-- SEGUIMIENTO -->
        <div class="section" id="sectionSeguimiento">
            <div class="section-title">Seguimiento</div>
            <div class="search-box">
                <input type="text" id="searchSeguimiento" placeholder="Buscar cliente..." onkeyup="app.buscarSeguimiento()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
            </div>
            <button class="btn btn-primary mb-10" onclick="app.mostrarModalSeguimiento()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Nuevo Seguimiento
            </button>
            <div id="listaSeguimiento"></div>
        </div>

        <!-- PRODUCTOS -->
        <div class="section" id="sectionProductos">
            <div class="section-title">Productos</div>
            <div class="search-box">
                <input type="text" id="searchProductos" placeholder="Buscar producto..." onkeyup="app.buscarProductos()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
            </div>
            <div id="listaProductos"></div>
        </div>

        <!-- NAVEGACIÓN -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="app.showSection('clientes')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Clientes
            </button>
            <button class="nav-item" onclick="app.showSection('ventas')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                Ventas
            </button>
            <button class="nav-item" onclick="app.showSection('seguimiento')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                Seguimiento
            </button>
            <button class="nav-item" onclick="app.showSection('productos')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                Productos
            </button>
        </div>
    </div>

    <!-- MODALES (Cliente, Seguimiento, Historial, WhatsApp, Promoción) sin cambios -->
    <!-- ... (copiar los mismos modales que tenías en el código anterior, no los pongo aquí por brevedad, pero NO LOS BORRES, van exactamente igual que antes) ... -->

    <!-- NUEVO MODAL: CONFIRMACIÓN DE VENTA (LÓGICA DE FINANZAS, SIN SUCURSAL INICIAL) -->
    <div class="modal-overlay" id="modalConfirmacionVenta">
        <div class="modal" style="max-width:450px;">
            <div class="modal-header">
                <div class="modal-title">Confirmar Venta</div>
                <button class="modal-close" onclick="app.cerrarModal('modalConfirmacionVenta')">&times;</button>
            </div>
            <div id="confirmacionVentaContenido"></div>
            <div id="confirmacionVentaError" style="color:red;text-align:center;margin-bottom:10px;"></div>
            <button class="btn btn-success w-full mt-10" onclick="app.guardarVentaDefinitiva()">Confirmar Venta</button>
        </div>
    </div>

    <script>
    // ============================================
    // DUAVA NEXO - VERSIÓN FUNCIONAL SIN SUCURSAL OBLIGATORIA
    // ============================================
    const app = {
        datos: { vendedores: [], clientes: [], productos: [], ventas: [], seguimientos: [] },
        estado: { vendedorActual: null, carrito: [], descuento: 0, offline: false, pendientes: [], lotesSeleccionados: {} },
        promoProducto: null,
        promoDescuento: 9,
        API_URL: 'https://script.google.com/macros/s/AKfycbxTRQ9z9FYrg9ya8ax8vIJco77ktkDUkf22lohUD-pt0um-qhwIAsB0tKWa8vb_Hnhv/exec',

        init() {
            this.cargarDatosLocales();
            this.detectarConexion();
            this.renderLoginVendedores();
            this.cargarDatos().then(() => {
                this.renderLoginVendedores();
            });
            const sesion = localStorage.getItem('duava_sesion');
            if (sesion) { this.estado.vendedorActual = JSON.parse(sesion); this.mostrarApp(); }
        },

        renderLoginVendedores() {
            const select = document.getElementById('loginVendedor');
            if (!select) return;
            select.innerHTML = '<option value="">Selecciona un vendedor...</option>';
            const maestro = { nombre: 'Abelardo', clave: '7512', especial: true };
            let lista = [maestro];
            if (this.datos && this.datos.vendedores && Array.isArray(this.datos.vendedores)) {
                lista = lista.concat(this.datos.vendedores);
            }
            lista.forEach(v => {
                const opt = document.createElement('option');
                opt.value = JSON.stringify(v);
                opt.textContent = v.nombre;
                select.appendChild(opt);
            });
        },

        login() {
            const select = document.getElementById('loginVendedor');
            const claveInput = document.getElementById('loginClave').value;
            const error = document.getElementById('loginError');
            if (!select.value) { error.textContent = 'Selecciona un vendedor'; error.style.display = 'block'; return; }
            const vendedor = JSON.parse(select.value);
            if (vendedor.clave !== claveInput) { error.textContent = 'Clave incorrecta'; error.style.display = 'block'; return; }
            this.estado.vendedorActual = vendedor;
            localStorage.setItem('duava_sesion', JSON.stringify(vendedor));
            error.style.display = 'none';
            this.mostrarApp();
        },

        mostrarApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            document.getElementById('userName').textContent = this.estado.vendedorActual.nombre;
            this.cargarDatos();
        },

        async cargarDatos() {
            this.mostrarSync('syncing');
            try {
                if (navigator.onLine && this.API_URL) {
                    const response = await fetch(this.API_URL + '?action=getData');
                    const data = await response.json();
                    this.datos = data;
                    this.guardarDatosLocales();
                    this.estado.offline = false;
                    this.mostrarSync('online');
                    this.procesarPendientes();
                } else { throw new Error('Offline'); }
            } catch (e) {
                this.estado.offline = true;
                this.mostrarSync('offline');
            }
            this.renderizarTodo();
        },

        guardarDatosLocales() { localStorage.setItem('duava_datos', JSON.stringify(this.datos)); },
        cargarDatosLocales() { const g = localStorage.getItem('duava_datos'); if (g) this.datos = JSON.parse(g); },
        detectarConexion() {
            window.addEventListener('online', () => { this.estado.offline = false; this.mostrarSync('online'); this.procesarPendientes(); });
            window.addEventListener('offline', () => { this.estado.offline = true; this.mostrarSync('offline'); });
        },
        mostrarSync(estado) {
            const el = document.getElementById('syncStatus');
            el.className = 'sync-status sync-' + estado;
            const textos = { online: '● Online', offline: '● Offline', syncing: '⟳ Sync...' };
            el.textContent = textos[estado];
        },
        agregarPendiente(op) {
            this.estado.pendientes.push({ ...op, timestamp: new Date().toISOString() });
            localStorage.setItem('duava_pendientes', JSON.stringify(this.estado.pendientes));
        },
        async procesarPendientes() {
            const pendientes = JSON.parse(localStorage.getItem('duava_pendientes') || '[]');
            if (!pendientes.length || !this.API_URL) return;
            for (const op of pendientes) {
                try { await fetch(this.API_URL, { method: 'POST', body: JSON.stringify(op) }); } catch (e) {}
            }
            localStorage.removeItem('duava_pendientes');
            this.estado.pendientes = [];
        },

        renderizarTodo() {
            this.renderClientes();
            this.renderProductos();
            this.renderSeguimiento();
            this.renderAlertas();
            this.renderSelects();
            this.renderProductosVenta();
        },
        showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('section' + id.charAt(0).toUpperCase() + id.slice(1)).classList.add('active');
            event.currentTarget.classList.add('active');
            if (id === 'ventas') this.renderProductosVenta();
        },

        // --- VENTA (Nueva lógica sin sucursal inicial) ---
        renderProductosVenta() {
            const container = document.getElementById('listaProductosVenta');
            const tienda = document.getElementById('ventaTienda').value;
            const productos = (this.datos.productos || []).filter(p => p.tienda === tienda && p.stock > 0);
            if (!productos.length) { container.innerHTML = '<div class="empty-state">No hay productos disponibles</div>'; return; }
            container.innerHTML = productos.map(p => {
                const enCarrito = this.estado.carrito.find(item => item.producto === p.producto);
                const cantidad = enCarrito ? enCarrito.cantidad : 0;
                return `<div class="product-item"><div class="product-info"><h4>${p.producto}</h4><div class="price">$${p.precio}</div><div class="stock">Stock: ${p.stock}</div></div><div class="product-actions"><button class="qty-btn" onclick="app.modificarCarrito('${p.producto}', -1)">-</button><span class="qty-display">${cantidad}</span><button class="qty-btn" onclick="app.modificarCarrito('${p.producto}', 1)">+</button></div></div>`;
            }).join('');
        },

        modificarCarrito(producto, cambio) {
            const prod = (this.datos.productos || []).find(p => p.producto === producto);
            if (!prod) return;
            const item = this.estado.carrito.find(i => i.producto === producto);
            if (cambio > 0) {
                if (item) { if (item.cantidad < prod.stock) item.cantidad++; }
                else { this.estado.carrito.push({ producto: producto, precio: prod.precio, cantidad: 1 }); }
            } else if (cambio < 0) {
                if (item) { item.cantidad--; if (item.cantidad <= 0) this.estado.carrito = this.estado.carrito.filter(i => i.producto !== producto); }
            }
            this.renderCarrito();
            this.renderProductosVenta();
        },

        renderCarrito() {
            const container = document.getElementById('cartItems');
            const summary = document.getElementById('cartSummary');
            if (!this.estado.carrito.length) { summary.style.display = 'none'; return; }
            summary.style.display = 'block';
            let subtotal = 0;
            container.innerHTML = this.estado.carrito.map(item => { const total = item.precio * item.cantidad; subtotal += total; return `<div class="cart-item"><span>${item.producto} x${item.cantidad}</span><span>$${total.toFixed(2)}</span></div>`; }).join('');
            const descuento = subtotal * (this.estado.descuento / 100);
            const total = subtotal - descuento;
            document.getElementById('cartTotal').innerHTML = `${this.estado.descuento > 0 ? `<div style="font-size:0.9rem;color:var(--gris-claro)">Descuento ${this.estado.descuento}%: -$${descuento.toFixed(2)}</div>` : ''}<div>Total: $${total.toFixed(2)}</div>`;
        },

        setDescuento(porcentaje) {
            this.estado.descuento = porcentaje;
            document.getElementById('descuentoCustom').value = '';
            document.querySelectorAll('.discount-btn').forEach(btn => { btn.classList.remove('active'); if (btn.textContent === porcentaje + '%') btn.classList.add('active'); });
            this.renderCarrito();
        },
        setDescuentoCustom() {
            const val = parseFloat(document.getElementById('descuentoCustom').value) || 0;
            this.estado.descuento = val;
            document.querySelectorAll('.discount-btn').forEach(btn => btn.classList.remove('active'));
            this.renderCarrito();
        },
        seleccionarClienteVenta() {
            const nombre = document.getElementById('ventaCliente').value;
            const info = document.getElementById('infoClienteVenta');
            if (nombre) { document.getElementById('clienteVentaNombre').textContent = nombre; info.classList.remove('hidden'); }
            else { info.classList.add('hidden'); }
        },

        async mostrarConfirmacionVenta() {
            const cliente = document.getElementById('ventaCliente').value;
            if (!cliente) { alert('Selecciona un cliente'); return; }
            if (!this.estado.carrito.length) { alert('Agrega productos al carrito'); return; }

            this.promoventaTemp = { lotes: [], seleccionados: {} };
            const contenedor = document.getElementById('confirmacionVentaContenido');
            contenedor.innerHTML = '<div class="loading"></div> Buscando lotes...';
            document.getElementById('modalConfirmacionVenta').classList.add('active');

            // Obtener lotes para cada producto sin filtrar por sucursal
            for (const item of this.estado.carrito) {
                try {
                    const url = `${this.API_URL}?action=getLotesProducto&producto=${encodeURIComponent(item.producto)}&tienda=${document.getElementById('ventaTienda').value}`;
                    const resp = await fetch(url);
                    const data = await resp.json();
                    const lotes = data.lotes || [];
                    this.promoventaTemp.lotes.push({ producto: item.producto, lotes: lotes });
                } catch(e) { }
            }

            let html = '';
            this.promoventaTemp.lotes.forEach((grupo, idx) => {
                const lotes = grupo.lotes;
                html += `<div style="margin-bottom:15px"><strong>${grupo.producto}</strong>`;
                if (lotes.length === 0) {
                    html += '<div style="color:#C75B5B">Sin stock disponible</div>';
                } else {
                    lotes.forEach((l, i) => {
                        const isFirst = i === 0;
                        html += `<div class="slote${isFirst ? ' sel' : ''}" onclick="app.seleccionarLote('${grupo.producto}', '${l.loteId}', this)" style="cursor:pointer;padding:8px;margin:4px 0;">
                            <span>Lote: ${l.loteId} | ${l.sucursal} | Vence: ${l.vencimiento} | Disponible: ${l.cantidadRestante}</span>
                            ${l.diasVencimiento <= 90 ? '<span class="badge-r">Próximo</span>' : ''}
                        </div>`;
                        if (isFirst) this.promoventaTemp.seleccionados[grupo.producto] = l.loteId;
                    });
                }
                html += '</div>';
            });
            contenedor.innerHTML = html;
        },

        seleccionarLote(producto, loteId, elemento) {
            this.promoventaTemp.seleccionados[producto] = loteId;
            const parent = elemento.parentNode;
            parent.querySelectorAll('.slote').forEach(s => s.classList.remove('sel'));
            elemento.classList.add('sel');
        },

        async guardarVentaDefinitiva() {
            const cliente = document.getElementById('ventaCliente').value;
            const tienda = document.getElementById('ventaTienda').value;
            const ahora = new Date();
            const fecha = ahora.toLocaleDateString('es-ES');
            const hora = ahora.toLocaleTimeString('es-ES');
            const errEl = document.getElementById('confirmacionVentaError');
            errEl.textContent = '';

            if (!cliente || !this.estado.carrito.length) { errEl.textContent = 'Faltan datos'; return; }

            const ventas = this.estado.carrito.map(item => {
                const loteId = this.promoventaTemp.seleccionados[item.producto];
                if (!loteId) { errEl.textContent = `Falta seleccionar lote para: ${item.producto}`; return null; }
                const loteInfo = this.promoventaTemp.lotes.find(g => g.producto === item.producto)?.lotes.find(l => l.loteId === loteId);
                return {
                    fecha, hora,
                    producto: item.producto,
                    cantidad: item.cantidad,
                    total: (item.precio * item.cantidad * (1 - this.estado.descuento/100)).toFixed(2),
                    motivo: this.estado.descuento > 0 ? 'Descuento ' + this.estado.descuento + '%' : 'Venta normal',
                    vendedor: this.estado.vendedorActual.nombre,
                    tienda: tienda,
                    loteId: loteId,
                    precioVenta: item.precio,
                    tipoVenta: 'Normal',
                    sucursal: loteInfo ? loteInfo.sucursal : ''
                };
            });

            if (ventas.some(v => v === null)) return;

            const payload = {
                action: 'realizarVenta',
                ventas: ventas,
                seguimiento: {
                    fecha: fecha + ' ' + hora,
                    cliente: cliente,
                    vendedor: this.estado.vendedorActual.nombre,
                    tipo: 'Venta',
                    producto: ventas.map(v => v.producto).join(', '),
                    nota: 'Total: $' + ventas.reduce((sum, v) => sum + parseFloat(v.total), 0).toFixed(2)
                },
                cliente: cliente,
                fechaContacto: fecha
            };

            try {
                const resp = await fetch(this.API_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await resp.json();
                if (result.success) {
                    alert('Venta registrada y stock actualizado correctamente.');
                    this.cerrarModal('modalConfirmacionVenta');
                    this.estado.carrito = [];
                    this.estado.descuento = 0;
                    this.renderCarrito();
                    this.renderProductosVenta();
                    this.cargarDatos();
                    this.renderClientes();
                    this.renderAlertas();
                } else {
                    errEl.textContent = result.error || 'Error desconocido';
                }
            } catch(e) {
                this.agregarPendiente(payload);
                alert('Venta guardada offline. Se sincronizará cuando haya conexión.');
            }
        },

        // --- El resto de funciones (Clientes, Seguimiento, Historial, Promociones, etc.) permanecen igual ---
        // ... (NO las modifiques, pégalas tal cual estaban en tu código anterior, incluyendo los modales de WhatsApp y Promoción) ...
    };
    document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
